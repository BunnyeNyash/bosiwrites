<div class='post-card'>
  <a class='post-image' href='{{ .Permalink }}' style="background-image:url('{{ if .Params.image }}{{ .Params.image | relURL }}{{ else }}https://placehold.co/400x300/0066FF/FFFFFF?text=BosiWrites{{ end }}')">
    {{ with .Params.categories }}<span class='post-tag'>{{ index . 0 }}</span>{{ end }}
  </a>
  <div class='post-body'>
    <h3 class='post-title'><a href='{{ .Permalink }}'>{{ .Title }}</a></h3>
    {{ with .Summary }}<p class='post-excerpt'>{{ . | plainify | truncate 110 }}</p>{{ end }}
    <div class='post-meta'>
      <span class='author'>{{ .Site.Params.author }}</span>
      <span class='date'>{{ .Date.Format "Jan 2, 2006" }}</span>
    </div>
  </div>
</div>
